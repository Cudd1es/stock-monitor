# config.yaml — global settings and secrets; read once at startup
timezone: America/Toronto

schedule:
  daily_brief: "16:10"     # HH:MM, brief for every ticker after the close; null turns it off
  intraday_minutes: 10     # check for moves every N minutes during market hours; null turns it off

notify_method: discord     # console | discord
report_language: zh        # en | zh | jp

# Per-ticker defaults; any ticker in watchlist.yaml can override them
defaults:
  alert_threshold: 5.0     # alert when |change vs previous close| exceeds this percent
  intraday: true           # include in intraday move checks
  research: true           # fetch news, SEC filings, analyst views and relative volume

# Notification secrets
discord:
  webhook_url: "https://discord.com/api/webhooks/xxxx/xxxx"
  mention_id: "xxxxxxxx"

# SEC EDGAR asks automated clients to identify themselves; filings are skipped without this
sec:
  user_agent: "Your Name your-email@example.com"
