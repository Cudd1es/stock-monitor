# config.yaml
timezone: America/Toronto

# Fallback defaults if user doesn’t specify
defaults:
  alert_threshold: 5.0
  schedule_time: "16:30"
  notify_method: "console"

# Notification secrets
discord:
  webhook_url: "https://discord.com/api/webhooks/xxxx/xxxx"
  mention_id: "xxxxxxxx"

# SEC EDGAR asks automated clients to identify themselves; filings are skipped without this
sec:
  user_agent: "Your Name your-email@example.com"
